name: FATHER Prototype CI

on:
  push:
    paths:
      - "prototype/father-workbench/**"
      - "projects/registry.json"
      - "config/dev_platform/**"
      - "docs/git/**"
      - "scripts/check_secret_hygiene.py"
      - ".github/workflows/father-prototype-ci.yml"
  pull_request:
    paths:
      - "prototype/father-workbench/**"
      - "projects/registry.json"
      - "config/dev_platform/**"
      - "docs/git/**"
      - "scripts/check_secret_hygiene.py"
      - ".github/workflows/father-prototype-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate prototype contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python syntax
        run: |
          python -m py_compile prototype/father-workbench/server.py
          python -m py_compile prototype/father-workbench/evidence_store.py
          python -m py_compile prototype/father-workbench/providers/base.py
          python -m py_compile prototype/father-workbench/providers/github_adapter.py
          python -m py_compile prototype/father-workbench/providers/gitlab_adapter.py
          python -m py_compile prototype/father-workbench/providers/gitverse_adapter.py
          python -m py_compile prototype/father-workbench/providers/sourcecraft_adapter.py
          python -m py_compile prototype/father-workbench/providers/gitflic_adapter.py
          python -m py_compile prototype/father-workbench/migration_engine.py
          python -m py_compile prototype/father-workbench/gate_engine.py
          python -m py_compile prototype/father-workbench/state_store.py
          python -m py_compile scripts/check_secret_hygiene.py
          python -m py_compile scripts/father_devsecops_baseline.py

      - name: Unit tests
        run: python -m unittest discover -s prototype/father-workbench/tests -v

      - name: Validate JSON contracts
        if: always()
        run: |
          python -m json.tool projects/registry.json > /dev/null
          python -m json.tool config/dev_platform/providers.json > /dev/null
          python -m json.tool docs/git/current_workspace.snapshot.json > /dev/null
          python -m json.tool config/gates/stage_gate_policies.json > /dev/null

      - name: Baseline secret hygiene
        if: always()
        run: python scripts/check_secret_hygiene.py

      - name: DevSecOps baseline and SPDX SBOM
        if: always()
        run: python scripts/father_devsecops_baseline.py --output artifacts/devsecops

      - name: Upload DevSecOps evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: father-devsecops-${{ github.sha }}
          path: artifacts/devsecops/
          if-no-files-found: warn
          retention-days: 30

      - name: Set up Node
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: JavaScript syntax
        if: always()
        run: node --check prototype/father-workbench/app.js
